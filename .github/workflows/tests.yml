name: Python demos - synthetic offline checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run synthetic-only tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Test the MAI browser submit handler
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: node --test tests/mai_console.test.cjs
